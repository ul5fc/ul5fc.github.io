<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>1.2億分の1 · 日本に生まれる人生シミュレーション（改良版）</title>
<meta name="description" content="日本の公的統計にもとづく人生シミュレーション。生まれる都道府県も、誰の子として生まれるかも選べないまま、生まれてから最期までを生きる体験。大正から2050年まで6つの時代が選べます。">
<meta property="og:type" content="website">
<meta property="og:title" content="1.2億分の1 · 日本に生まれる人生シミュレーション（改良版）">
<meta property="og:description" content="約46秒にひとり生まれる「そのひとり」になって一生を生きる、統計ベースの人生シミュレーション。">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#F7F3EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F3EA; --paper2:#FFFDF7; --ink:#1C1811; --ink2:#5A5344; --line:#E3DCC9;
  --accent:#7E2A20; --accent-soft:#F3D9D2; --gold:#B98A2F; --card:#FFFDF7;
  --he:#4A6FA5; --ha:#D98E2B; --kn:#5E8C61; --re:#C9A227;
  --newhl:#F8EFD2;
  --shadow:0 2px 6px rgba(60,45,20,.06),0 14px 34px rgba(60,45,20,.08);
  --shadow-sm:0 1px 3px rgba(60,45,20,.07),0 6px 16px rgba(60,45,20,.06);
  --r:20px; --ease:cubic-bezier(.23,1,.32,1);
}
body.dark{--paper:#171512;--paper2:#211E19;--ink:#EFE9DA;--ink2:#B4AB97;--line:#3A352B;--card:#211E19;--accent-soft:#4A2C24;--newhl:#4A3D20;--shadow:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);--shadow-sm:0 1px 3px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.mincho{font-family:"Shippori Mincho",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:18px}
.small{font-size:.82rem;color:var(--ink2)}
.hidden{display:none!important}
/* ---------- landing ---------- */
header.hero{padding:38px 0 8px;text-align:center;position:relative}
.hero .kicker{letter-spacing:.35em;font-size:.78rem;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:800;line-height:1.15;margin:6px 0}
.hero .sub{font-size:clamp(1rem,3vw,1.2rem);color:var(--ink2);max-width:640px;margin:0 auto}
.counter{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 4px}
.counter .box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:10px 18px;min-width:170px}
.counter .num{font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.counter .lbl{font-size:.75rem;color:var(--ink2)}
.count-note{font-size:.72rem;color:var(--ink2)}
.panel{max-width:760px;margin:18px auto}
.panel h3{font-size:.95rem;margin:14px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--paper2);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.92rem;transition:border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease);min-height:44px}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#FFF7EC}
.pill .era-sub{display:block;font-size:.68rem;font-weight:500;opacity:.75}
select.pref{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper2);color:var(--ink);font-size:1rem;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 26px;font-weight:900;font-size:1rem;background:var(--paper2);border:1.5px solid var(--line);transition:transform .16s var(--ease),box-shadow .16s var(--ease);min-height:50px}
.btn:hover{box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFF7EC}
.btn.big{font-size:1.25rem;padding:18px 44px;width:100%;margin-top:16px;box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem;background:var(--paper2);min-height:44px}
.toggle .dot{width:34px;height:19px;border-radius:99px;background:var(--line);position:relative;transition:background .18s var(--ease);flex:none}
.toggle .dot::after{content:"";position:absolute;top:2.5px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .18s var(--ease)}
.toggle[aria-pressed="true"] .dot{background:var(--ink)}
.toggle[aria-pressed="true"] .dot::after{left:17px}
.toggle .st{font-size:.72rem;color:var(--ink2)}
.toggle[aria-pressed="true"] .st{color:var(--ink)}
/* badges / past lives */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.badge-progress{height:10px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden;margin:8px 0 10px}
.badge-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .8s var(--ease)}
.badge-cat{font-family:"Shippori Mincho",serif;font-weight:700;font-size:.98rem;margin:16px 0 7px;display:flex;align-items:baseline;gap:8px}
.badge-cat-n{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.72rem;font-weight:700;color:var(--ink2)}
.era-zukan{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;background:var(--paper2)}
.era-zukan-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mark-chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:.74rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink2);background:var(--card)}
.mchip.got{color:#7A5B12;background:#F7E9BE;border-color:#E4CF8E}
.prefmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.ptile{border-radius:10px;padding:6px 2px 5px;text-align:center;border:1px solid var(--line);background:var(--paper2);color:var(--ink2)}
.ptile .pt-name{font-size:.72rem;font-weight:700;line-height:1.2}
.ptile .pt-n{font-size:.64rem}
.ptile.n1{background:#E3EFDA;color:var(--ink)}
.ptile.n2{background:#C6E2B4;color:var(--ink)}
.ptile.n3{background:#A3D18C;color:var(--ink)}
.ptile.n4{background:#7FB96A;color:#20301A}
.badge{border:1px solid var(--line);border-radius:14px;padding:9px 10px;font-size:.78rem;background:var(--paper2)}
.badge.got{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--paper2))}
.badge .bn{font-weight:700}
.badge .bh{color:var(--ink2);font-size:.74rem;line-height:1.4}
.past{border-left:3px solid var(--accent-soft);padding:6px 0 6px 12px;margin:8px 0}
details.src{margin-top:14px}
.tel-list a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
details.src p a{color:var(--accent);font-weight:700}
details.src summary{cursor:pointer;font-weight:700;font-size:.9rem;padding:6px 0}
/* ---------- play ---------- */
.topbar{position:sticky;top:0;z-index:78;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0 8px}
.topbar .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.topbar .who .name{font-family:"Shippori Mincho",serif;font-weight:800;font-size:1.15rem}
.agebar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.agebar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s var(--ease)}
.playgrid{display:grid;grid-template-columns:300px 1fr 300px;gap:14px;align-items:start;margin-top:12px}
@media(max-width:960px){.playgrid{grid-template-columns:1fr}.playgrid .col{display:none}.playgrid .col.active{display:block}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
canvas.face,canvas.scene{width:100%;height:auto;display:block;border-radius:14px;image-rendering:pixelated;background:#EDE6D4}
body.dark canvas.face,body.dark canvas.scene{background:#2A251C}
.stat{margin:9px 0}
.stat .sl{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700}
.stat .bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:3px}
.stat .bar>i{display:block;height:100%;border-radius:99px;transition:width .8s var(--ease)}
.delta-float{position:fixed;z-index:90;font-weight:900;font-size:1.05rem;pointer-events:none;animation:floatUp 1.15s var(--ease) forwards;text-shadow:0 1px 0 var(--paper)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-42px)}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.kv>span{flex:none;white-space:nowrap}
.kv>b{text-align:right;min-width:0}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.logtools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:700;background:var(--paper2);min-height:38px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.logentry{position:relative;padding:9px 38px 9px 12px;border-radius:12px;margin:6px 0;background:var(--paper2);border:1px solid var(--line);cursor:pointer;line-height:1.6}
.logentry .starbtn{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;color:var(--ink2);font-size:1.05rem;line-height:1;display:flex;align-items:center;justify-content:center}
.logentry .starbtn.on{color:var(--gold)}
.logentry .chev{position:absolute;right:12px;bottom:6px;font-size:.68rem;color:var(--ink2);opacity:.75;pointer-events:none}
.logentry .parts{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:6px}
.logentry .part{display:flex;gap:8px;font-size:.87rem;line-height:1.55}
.logentry .part .pk{flex:none;align-self:flex-start;font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;margin-top:2px}
.logentry.newest{background:var(--newhl)}
#logBox{max-height:520px;overflow-y:auto;overscroll-behavior:contain}
@media(max-width:960px){#logBox{max-height:46vh}}
.logentry.major{border-left:5px solid var(--ink2)}
.logentry.decision{border-left:5px solid var(--accent)}
.logentry.hitoiki{border-left:5px solid var(--gold)}
.logentry.history{border-left:5px solid var(--ink2)}
.logentry.companion{border-left:5px solid var(--re)}
.logentry .age{font-weight:900;font-size:.8rem;color:var(--ink);margin-right:6px}
.logentry .star{float:right;color:var(--gold);font-size:1rem}
.logentry .auto-tag{font-size:.68rem;background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700}
.chapter-h{font-family:"Shippori Mincho",serif;font-weight:800;font-size:1.05rem;margin:16px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mapgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.mapgrid i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.mapgrid i.lived{background:var(--gold)}
.mapgrid i.now{background:var(--gold);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.money-act{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 12px;margin:6px 0;min-height:52px}
.money-act:hover:not(:disabled){border-color:var(--accent)}
.money-act:disabled{opacity:.5;cursor:not-allowed}
.money-act .mt{font-weight:700;font-size:.9rem}
.money-act .mr{font-size:.7rem;color:var(--ink2)}
.focus-sel{display:flex;flex-wrap:wrap;gap:6px}
.focus-btn{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:700;background:var(--paper2);min-height:40px}
.focus-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* modal sheet */
.overlay{position:fixed;inset:0;background:rgba(24,18,8,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s var(--ease)}
.sheet{background:var(--card);border-radius:24px;box-shadow:var(--shadow);max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;animation:sheetIn .25s var(--ease)}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:640px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:92vh;width:100%}}
.choice-btn{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper2);border-radius:16px;padding:14px 16px;margin:9px 0;min-height:56px;transition:border-color .15s var(--ease),transform .15s var(--ease)}
.choice-btn:hover{border-color:var(--accent)}
.choice-btn .cl,.choice-btn .ch{display:block}
.choice-btn .cl{font-weight:900;font-size:1.02rem}
.choice-btn .ch{font-size:.8rem;color:var(--ink2);margin-top:2px}
.choice-btn .ch.hist{color:#8A6D1F;font-weight:700}
.nowbaby{margin-top:16px;text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}
.nb-title{font-weight:700;font-size:.86rem;margin-bottom:4px}
.nb-row{display:flex;align-items:center;gap:8px;font-size:.8rem;margin-top:5px}
.nb-name{flex:none;width:4.4em;font-weight:700}
.nb-bar{flex:1;height:9px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.nb-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.nb-pct{flex:none;width:3.6em;text-align:right;color:var(--ink2)}
.bmap{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:350px;margin:12px auto 2px}
.btile{font-size:.58rem;padding:3px 5px;border-radius:6px;background:var(--paper2);border:1px solid var(--line);color:var(--ink2);transition:background .12s,color .12s,transform .12s}
.btile.hot{background:var(--gold);color:#4A3510;border-color:var(--gold)}
.btile.hit{background:var(--accent);color:#FFF8EA;border-color:var(--accent);font-weight:700;transform:scale(1.18)}
.choice-btn .ch b.hint-he{color:var(--he)}.choice-btn .ch b.hint-ha{color:#A87B1E}.choice-btn .ch b.hint-kn{color:var(--kn)}.choice-btn .ch b.hint-re{color:var(--re)}.choice-btn .ch b.hint-m{color:var(--gold)}
.timerbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.timerbar>i{display:block;height:100%;background:var(--accent)}
.timerbar.gold>i{background:var(--gold)}
/* v3: decision / hitoiki bottom panel (no dark backdrop, life stays visible) */
.clickshield{position:fixed;inset:0;z-index:74;background:transparent}
.dpanel{animation:none;position:fixed;left:50%;bottom:0;transform:translate(-50%,106%);width:100%;max-width:720px;max-height:46vh;overflow-y:auto;background:var(--card);border-top:3px solid var(--accent);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(60,45,20,.18);padding:16px 20px calc(16px + env(safe-area-inset-bottom));z-index:75;transition:transform .32s var(--ease)}
.dpanel.show{transform:translate(-50%,0)}
.dpanel.hito{border-top-color:var(--gold)}
@media(max-width:640px){.dpanel{max-height:52vh}}
.dpanel .dp-head{font-size:.78rem;color:var(--ink2)}
.dpanel .dp-head .dp-mark{color:var(--accent);font-weight:900}
.dpanel.hito .dp-head .dp-mark{color:var(--gold)}
.dpanel .dp-q{font-family:"Shippori Mincho",serif;font-weight:800;font-size:1.35rem;margin:5px 0 4px;line-height:1.45}
.dpanel .dp-foot{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.dpanel .dp-foot .timerwrap{flex:1;min-width:0}
.dpanel .timerbar{margin:0 0 4px}
.dpanel .choice-btn{margin:7px 0}
/* v3: per-stat last-year delta */
.sdelta{font-size:.78rem;font-weight:900;margin-left:6px;font-variant-numeric:tabular-nums}
.sdelta.up{color:#3F7D2C}
.sdelta.dn{color:#C0392B}
/* v3: ending kicker + voice buttons */
.end-kicker{color:var(--accent);font-weight:700;font-size:.88rem;letter-spacing:.05em}
.voice-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.voice-btn{border:1.5px solid var(--line);background:var(--paper2);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem;min-height:44px}
.voice-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.voice-line{font-family:"Shippori Mincho",serif;font-size:1.05rem;margin-top:12px}
#endLogBox{max-height:60vh;overflow-y:auto;overscroll-behavior:contain}
/* v3: slim sticky top bar on mobile */
@media(max-width:640px){
  .topbar{padding:6px 0}
  .topbar .who .name{font-size:1rem}
  .topbar .who .small{display:none}
  .agebar{height:7px;margin-top:4px}
  .ctlbar{margin-top:5px;flex-wrap:wrap;overflow-x:visible}
  .icobtn{width:40px;height:40px}
  .ctlbar .seg button{padding:5px 9px;min-height:40px;font-size:.78rem}
  .txtbtn{font-size:.8rem;padding:7px 6px;min-height:40px}
  #ctlSkipDec,#ctlOmakase{flex:none}
}
/* birth overlay */
.birth-stage{text-align:center;padding:30px 10px}
.birth-stage .roulette{font-family:"Shippori Mincho",serif;font-size:clamp(2rem,9vw,3.4rem);font-weight:800;min-height:1.3em}
.birth-card{max-width:430px;margin:0 auto;text-align:left}
.rarity{display:inline-block;background:var(--accent);color:#FFF7EC;border-radius:999px;padding:4px 14px;font-weight:900;font-size:.9rem}
/* ending */
.ending-hero{text-align:center;padding:26px 10px}
.ending-hero .age{font-family:"Shippori Mincho",serif;font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800}
.title-name{display:inline-block;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:5px 18px;font-weight:900;font-family:"Shippori Mincho",serif}
.epitaph{font-family:"Shippori Mincho",serif;font-size:1.15rem;padding:16px;border-left:4px solid var(--gold);background:var(--paper2);border-radius:0 14px 14px 0;margin:12px 0}
.diffbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.diffbox{grid-template-columns:1fr}}
.diffbox .dcol{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;font-weight:700;z-index:120;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);box-shadow:var(--shadow);max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottomtabs{display:none}
@media(max-width:960px){
  .bottomtabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}

.era-card .era-sub{font-size:.78rem;color:var(--ink2)}

.era-card.on{border-color:var(--ea,#B3402A);background:var(--paper2);box-shadow:var(--shadow-sm)}
.mode-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mode-card{text-align:left;width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:60px;transition:border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper2)}
.seg button{padding:8px 14px;font-weight:700;font-size:.85rem;min-height:40px}
.seg button.on{background:var(--ink);color:var(--paper)}

.cyclebar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.cyclebar>i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;animation:cycgrow linear infinite}
@keyframes cycgrow{from{width:0}to{width:100%}}
.cycledot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;animation:pulse 1.6s infinite;vertical-align:1px}

.ctlbar{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

    if(!last.parts)last.parts=[{txt:last.txt,kind:last.kind}];
    last.parts.push({txt:entry.txt,kind:entry.kind});
    last.txt=last.txt+(/[。！？]$/.test(last.txt)?"":" ")+entry.txt;
    if((LOG_PRIO[entry.kind]||0)>(LOG_PRIO[last.kind]||0))last.kind=entry.kind;

    if(entry.auto&&!last.auto)last.auto=entry.auto;
    return last;

     line. All 3 companions share scripted school ages, so at 6/12/18 the old
     code dumped 3 identical gold cards in a row (user screenshot, 2026-11-04).

  const compHits=[];
  for(const c of s.companions){for(const ev of c.events){if(ev.age===a)compHits.push({c:c,ev:ev})}}

  for(const h of compHits){

Sim.prototype._economy=function(){

  }else if(s.retired){

Sim.prototype._focusBonus=function(){
  const s=this.s;if(s.age<6)return;
  const list=FOCUS[focusStage(s.age)];
  const f=s.focusSel&&list.find(x=>x[0]===s.focusSel)?list.find(x=>x[0]===s.focusSel):list[0];
  if(f[1]==="m")this._money(s.age,"今年の重点（"+f[0]+"）",f[2]);
  else{const before=s.stats[f[1]];s.stats[f[1]]=clamp(before+f[2],0,100);const dd=s.stats[f[1]]-before;if(dd)s.lastDeltas[f[1]]=(s.lastDeltas[f[1]]||0)+dd}

/* 死亡モデル: 時代別の乳児死亡率・子ども/若年ハザード・成人ゴンパーツ型ハザード。
   パラメータは各時代の平均寿命（男女平均）にヘッドレス平均が収まるよう調整済み。 */
const ERA_MORT={
1920:{inf:0.166,child:0.014,young:0.0050,A:0.0052,g:9.0},
1940:{inf:0.090,child:0.007,young:0.0055,A:0.0056,g:9.2},
1955:{inf:0.040,child:0.003,young:0.0018,A:0.0020,g:9.4},
1990:{inf:0.0046,child:0.0004,young:0.0007,A:0.00058,g:8.8},
2026:{inf:0.0018,child:0.00015,young:0.00055,A:0.00040,g:8.8},
2050:{inf:0.0015,child:0.0001,young:0.0004,A:0.00024,g:9.0}};
/* 死因テーブル（成人・重み）。2026年は厚労省2024年確定数の構成比に近似:
   がん約24% / 心臓約14% / 老衰約13% / 脳約7% / 肺炎約5%。結核は1955年以前の時代のみ。 */
const CAUSE_ADULT={
1920:[["結核",24],["肺炎",18],["胃腸炎",13],["脳の病気",10],["心臓の病気",9],["がん",6],["事故",6],["老衰",4],["その他",10]],
1940:[["結核",26],["肺炎",16],["胃腸炎",11],["脳の病気",10],["心臓の病気",9],["がん",8],["事故",7],["老衰",4],["その他",9]],
1955:[["がん",16],["脳の病気",15],["心臓の病気",13],["結核",11],["肺炎",9],["事故",9],["老衰",6],["胃腸炎",4],["その他",17]],
1990:[["がん",28],["心臓の病気",16],["脳の病気",14],["肺炎",9],["老衰",10],["事故",6],["その他",17]],
2026:[["がん",24],["心臓の病気",14],["老衰",13],["脳の病気",7],["肺炎",5],["事故",4],["その他",33]],
2050:[["がん",22],["老衰",18],["心臓の病気",13],["脳の病気",7],["肺炎",5],["事故",3],["その他",32]]};
Sim.prototype._pickCause=function(age){
  const s=this.s,era=s.era,rng=this.rng;
  let table;
  if(age<1)table=era<=1955?[["肺炎",50],["胃腸炎",35],["その他",15]]:[["その他",60],["肺炎",25],["心臓の病気",15]];
  else if(age<5)table=era<=1955?[["肺炎",32],["胃腸炎",24],["結核",8],["事故",12],["その他",24]]:[["事故",30],["肺炎",22],["その他",36],["心臓の病気",12]];
  else if(age<40)table=era<=1955?[["結核",30],["肺炎",13],["事故",15],["脳の病気",8],["心臓の病気",8],["がん",6],["胃腸炎",4],["その他",16]]:[["事故",38],["がん",18],["心臓の病気",12],["脳の病気",8],["肺炎",4],["その他",20]];
  else table=CAUSE_ADULT[era]||CAUSE_ADULT[2026];
  const items=table.filter(c=>c[0]!=="老衰"||age>=75);
  let tot=0;const ws=items.map(c=>{let w=c[1];if(c[0]==="がん"&&s.flags.smoker)w*=1.6;tot+=w;return w});
  let r=rng.next()*tot;
  for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i][0]}
  return items[items.length-1][0];
};
Sim.prototype._deathCheck=function(){
  const s=this.s,a=s.age,rng=this.rng;
  const M=ERA_MORT[s.era]||ERA_MORT[2026];
  let h;
  if(a<1)h=0;
  else if(a<5)h=M.child;
  else if(a<40)h=M.young;
  else h=M.A*Math.exp((a-40)/M.g);
  h*=clamp(1-s.healthCap*0.012,0.6,1.6);
  if(s.stats.he<30)h*=1.5;if(s.ill)h*=1.8;
  if(a>=112)h=1;
  if(rng.next()<Math.min(1,h)){
    s.dead=true;s.deathAge=a;s.deathYear=s.year;
    s.cause=this._pickCause(a);
    this._log(a,s.cause+"で亡くなる。","major");
    return true;
  }
  return false;
};
Sim.prototype._promote=function(){
  const s=this.s;
  while(s.queue.length){
    const q=s.queue.shift();
    if(q.kind==="hitoiki"){if(HITOIKI.some(h=>h.age===q.hitoAge)&&!s.hitoAnswers[q.hitoAge]){s.pending=q;return q.kind}continue}
    const ev=EVENT_MAP[q.evId];if(!ev)continue;
    if(q.evId==="illness"&&s.ill){if(visibleChoices(s,ev).length>=1){s.pending=q;return q.kind}continue}
    if((s.used[ev.id]||0)>=(ev.maxUses||1))continue;
    if(!condPass(s,ev.cond))continue;
    if(visibleChoices(s,ev).length<1)continue;
    s.pending=q;return q.kind;
  }
  return null;
};
Sim.prototype.advance=function(){
  const s=this.s;
  if(s.dead)return"done";
  if(s.pending)return s.pending.kind;
  if(s.queue.length){const pk=this._promote();if(pk)return pk}
  if(s.age===0&&!s._infRolled){s._infRolled=true;const im=(ERA_MORT[s.era]||ERA_MORT[2026]).inf;
    if(this.rng.chance(im)){s.dead=true;s.deathAge=0;s.deathYear=s.year;s.cause=this._pickCause(0);this._log(0,"生まれてまもなく、"+s.cause+"で亡くなる。","major");return"done"}}
  s.age++;s.year++;s.lastDeltas={};
  const logBefore=s.log.length;
  s.focusLog[s.age]=s.focusSel||null;
  this._focusBonus();
  this._milestone();
  this._familyYear();
  this._economy();
  /* illness trigger */
  if(!s.ill&&s.age>=48&&this.rng.chance(0.018+Math.max(0,-s.healthCap)*0.004+(s.flags.smoker?0.02:0))){
    s.ill=true;s.illSince=s.age;s.queue.push({kind:"decision",evId:"illness"});
    this._log(s.age,"体の不調が見つかる。大病の兆しがある。","major");
  }

  for(const d of due){
    const ev=EVENT_MAP[d.evId];if(!ev)continue;
    if(condPass(s,ev.cond)&&visibleChoices(s,ev).length>=1)s.queue.push({kind:"decision",evId:ev.id});

  }
  /* illness follow-up: never strand s.ill — re-queue a recovery check if untreated for 3+ years */
  if(s.ill&&s.illSince&&s.age-s.illSince>=3&&!s.queue.some(q=>q.evId==="recovery"||q.evId==="illness"||q.evId==="illness_decide"))s.queue.push({kind:"decision",evId:"recovery"});

  if(s.age>=75){
    const legacy=EVENTS.filter(e=>e.final&&!(s.used[e.id]>0)&&s.age>=e.min&&s.age<=e.max);
    if(legacy.length&&this.rng.chance(0.5))s.queue.push({kind:"decision",evId:this.rng.pick(legacy).id});
  }
  /* age-locked events (min===max) are appointments, not lottery entries.
     hs_choice (15) and exam_day (18) gate the whole education/career arc;
     in the random pool each fired in only ~6% of lives, so most lives never
     entered school or work at all (playtest: 32/40 random lives jobless). */
  {
    /* Queued unconditionally (not only when the queue is empty): panels
       serialize across advance() calls without the age moving, so an
       age-locked event sharing its year with a hitoiki (age 15!) or a
       scheduled event still gets its turn at the right age. */
    const locked=EVENTS.filter(e=>!e.schedOnly&&!e.final&&e.min===s.age&&e.max===s.age&&(!e.era||e.era.includes(s.era))&&(s.used[e.id]||0)<(e.maxUses||1)&&condPass(s,e.cond)&&visibleChoices(s,e).length>=2);
    if(locked.length)s.queue.push({kind:"decision",evId:this.rng.pick(locked).id});
  }
  /* life appointments: partnership and children are offered on a cadence,
     not left to pool luck. In fuzzing, marriage_decision reached only ~58%
     of lives and want_child almost never chained into children (~7% of
     lives), starving the child/grandchild arcs. _promote re-checks cond and
     maxUses when an offer pops, so a stale offer is harmless. offersDue
     counts scheduled offers only; organic pool fires count toward it. */
  {
    const mdDue=(s.age>=25?1:0)+(s.age>=32?1:0);
    if(!s.spouse&&mdDue>0&&(s.used["marriage_decision"]||0)<mdDue&&!s.queue.some(q=>q.evId==="marriage_decision"))s.queue.push({kind:"decision",evId:"marriage_decision"});
    const wcDue=[28,32,36].filter(x=>s.age>=x).length;
    if(s.spouse&&wcDue>0&&(s.used["want_child"]||0)<wcDue&&!s.queue.some(q=>q.evId==="want_child"))s.queue.push({kind:"decision",evId:"want_child"});
  }
  /* random decision */
  if(!s.queue.length){
    const a=s.age,decade=Math.floor(a/10);
    const decCount=s.choiceLog.filter(c=>Math.floor(c.age/10)===decade).length;
    const p=a<12?0.30:a<18?0.5:a<30?0.45:a<50?0.38:a<65?0.32:0.22;
    if(decCount<7&&this.rng.chance(p)){
      const pool=EVENTS.filter(e=>!e.schedOnly&&!e.final&&a>=e.min&&a<=e.max&&(!e.era||e.era.includes(s.era))&&(s.used[e.id]||0)<(e.maxUses||1)&&condPass(s,e.cond)&&visibleChoices(s,e).length>=2);
      if(pool.length)s.queue.push({kind:"decision",evId:this.rng.pick(pool).id});
    }
  }
  /* Ambient flavor fills ONLY a year that produced no record of its own.
     Before this gate, a milestone year also got an ambient card, so a single
     year dumped 2-3 cards at once (user screenshot: age 1 milestone+ambient). */
  if(!s.queue.length&&s.log.length===logBefore){
    const pool=AMBIENT[ambientStage(s.age)];
    /* Never repeat an ambient line while the stage pool still has unused
       ones (pools are 16 per stage; a repeat is the last resort). The same
       sentence at ages 2 and 4 (seen in playtest) reads as filler. */
    const fresh=pool.filter(t=>!s.log.some(e=>e.txt.includes(t)));
    this._log(s.age,this.rng.pick(fresh.length?fresh:pool),"norm");
  }
  if(this._deathCheck())return"done";
  const pk2=this._promote();if(pk2)return pk2;
  return"year";
};

Sim.prototype._schedule=function(delay,evId){
const age=typeof delay==="string"&&delay[0]==="@"?parseInt(delay.slice(1),10):this.s.age+delay;

};

Sim.prototype.choose=function(idx,autoTag){

/* ---------- headless runner ---------- */
function policyIndex(sim,ev){
const vis=visibleChoices(sim.s,ev);if(!vis.length)return 0;
const r=new RNG(sim.s.seed+"|policy|"+ev.id+"|"+sim.s.choiceLog.length);

}
function runHeadless(seed,settings,opts){
opts=opts||{};
const sim=new Sim(seed,settings);
sim.s.seed=seed;
const script=opts.script?opts.script.slice():null;
let steps=0;
while(!sim.s.dead&&steps<400){
steps++;
/* deterministic focus: weakest stat */
const list=FOCUS[focusStage(sim.s.age)];
let best=list[0],bv=1e9;for(const f of list){const v=f[1]==="m"?50:sim.s.stats[f[1]];if(v<bv){bv=v;best=f}}
sim.s.focusSel=(opts.focusLog&&opts.focusLog[sim.s.age+1])||best[0];
const r=sim.advance();
if(r==="decision"){
const ev=EVENT_MAP[sim.s.pending.evId];
let idx;
if(script&&script.length)idx=script.shift();
else if(opts.flipAt!==undefined&&sim.s.choiceLog.length===opts.flipAt)idx=opts.flipTo;
else idx=policyIndex(sim,ev);
sim.choose(clamp(idx,0,Math.max(0,visibleChoices(sim.s,ev).length-1)),opts.autoTag||"");
}else if(r==="hitoiki"){
sim.answerHitoiki(policyIndex(sim,{choices:HITOIKI.find(h=>h.age===sim.s.pending.hitoAge).opts.map(o=>({}))}),"自動回答");
}
if(r==="done")break;
}
return sim;
}

/* ---------- static graph validation + invariant tests ---------- */
const SP_SET_FLAGS=["examPassed","examFailed","doctorPath","todai","proAthlete","clubStar","startupOK","startupFailed","recovered","wentTokyo","uturn","threeGen","lovePair","loveUnresolved"];
const EXTRA_CONSUMED=["studyHard","studyBalance","studyLoose","hsAdvance","hsTech","examPassed","doctorPath","todai","proAthlete","startupOK","recovered","wentTokyo","uturn","threeGen","checkupFan","bubbleIn","bubbleHalf","bubbleOut","childFree","childAdvice","aiDelegate","aiCraft","aiMaker","postwarSurvivor","jokyu","dreamSkill","promoted","hasHouse","licenseReturned","volunteer","epidemicHelper","fireCorps","liveWithParents","firstLoveReunion","quitSmoke","noSmoke","exerciser","investor","workLong","workedTeen","smoker","smokeLight","legacyTalk","legacyWill","funeralSmall","funeralBig","letterWrote","keepsakeGiven","keepsakeGrandchild","diaryWrote"];
const ENGINE_QUEUED=["illness"];
const SP_SCHEDULED=["club_scout","love_after","ronin","startup_restart","career_start"];
function collectCondFlags(c,acc){if(!c)return;["flags","flagsAny","noFlags"].forEach(k=>{if(c[k])c[k].forEach(f=>acc.add(f))})}
function validateGraph(){
  const errors=[],warnings=[];
  const ids=new Set();
  for(const ev of EVENTS){if(ids.has(ev.id))errors.push("duplicate event id: "+ev.id);ids.add(ev.id);
    if(!ev.choices||ev.choices.length<2)errors.push("event "+ev.id+" has <2 choices");
    if(ev.min>ev.max)errors.push("event "+ev.id+" age range inverted");
    if(ev.era)for(const e of ev.era)if(!ERAS.some(x=>x.id===e))errors.push("event "+ev.id+" bad era "+e);
    for(const ch of ev.choices){if(ch.sched)for(const sc of ch.sched)if(!EVENT_MAP[sc[1]])errors.push("event "+ev.id+" schedules missing "+sc[1])}}
  const setFlags=new Set(SP_SET_FLAGS);
  for(const ev of EVENTS)for(const ch of ev.choices)if(ch.flags)ch.flags.forEach(f=>setFlags.add(f));
  const consumed=new Set(EXTRA_CONSUMED);
  for(const ev of EVENTS){collectCondFlags(ev.cond,consumed);for(const ch of ev.choices)collectCondFlags(ch.cond,consumed)}
  for(const f of setFlags)if(!consumed.has(f))errors.push("flag set but never consumed: "+f);
  /* reachability fixpoint */
  const targeted=new Set(ENGINE_QUEUED.concat(SP_SCHEDULED));
  for(const ev of EVENTS)for(const ch of ev.choices)if(ch.sched)ch.sched.forEach(sc=>targeted.add(sc[1]));
  const available=new Set(),reachable=new Set();let changed=true,guard=0;
  while(changed&&guard++<30){changed=false;
    for(const ev of EVENTS){
      if(reachable.has(ev.id))continue;
      if(ev.schedOnly&&!targeted.has(ev.id)&&!ev.final)continue;
      const c=ev.cond||{};
      if(c.flags&&!c.flags.every(f=>available.has(f)))continue;
      if(c.flagsAny&&!c.flagsAny.some(f=>available.has(f)))continue;
      reachable.add(ev.id);changed=true;
      for(const ch of ev.choices){if(ch.flags)ch.flags.forEach(f=>{if(!available.has(f)){available.add(f)}});if(ch.sp)SP_SET_FLAGS.forEach(f=>available.add(f))}
    }}
  for(const ev of EVENTS)if(!reachable.has(ev.id))errors.push("event unreachable in principle: "+ev.id);
  if(BADGES.length!==60)errors.push("badge count is "+BADGES.length+", expected 60");
  if(EVENTS.length<45)errors.push("event count "+EVENTS.length+" < 45");
  if(HITOIKI.length!==5)errors.push("hitoiki count "+HITOIKI.length);
  return{errors:errors,warnings:warnings,eventCount:EVENTS.length,badgeCount:BADGES.length,reachable:reachable.size};
}
function runTests(){
  const lines=[];let pass=true;
  const g=validateGraph();
  lines.push("== graph validation ==");
  lines.push("events: "+g.eventCount+", badges: "+g.badgeCount+", reachable events: "+g.reachable+"/"+g.eventCount);
  if(g.errors.length){pass=false;g.errors.forEach(e=>lines.push("ERROR: "+e))}else lines.push("graph: OK (no dead flags, no missing targets, all reachable)");
  lines.push("== 200 headless lives ==");
  const seenEvents=new Set();let fails=0,deathSum=0;
  for(let i=0;i<200;i++){
    const era=ERAS[i%ERAS.length].id;
    let sim;try{sim=runHeadless("test-"+i,{era:era,mode:"digest"})}catch(e){fails++;lines.push("FAIL life "+i+" exception: "+e.message);continue}
    const s=sim.s;deathSum+=s.deathAge;
    const errs=[];
    if(!s.dead)errs.push("did not terminate");
    if(s.deathAge<0||s.deathAge>112)errs.push("deathAge out of range: "+s.deathAge);
    for(const k of["he","ha","kn","re"])if(s.stats[k]<0||s.stats[k]>100)errs.push("stat "+k+" out of range: "+s.stats[k]);
    if(s.healthCap<-30||s.healthCap>25)errs.push("healthCap out of range: "+s.healthCap);
    if(s.dead&&s.pending)errs.push("pending not null when dead");
    const decLogs=s.log.reduce((a,l)=>a+(l.decN||(l.kind==="decision"?1:0)),0);
    if(decLogs!==s.choiceLog.length)errs.push("choiceLog "+s.choiceLog.length+" != decision log sentences "+decLogs);
    if(savingsOf(s)!==Math.round(s.ledger.reduce((a,l)=>a+l.amt,0)))errs.push("ledger mismatch");
    const births=s.log.filter(l=>l.kind==="birth").length;
    if(births!==s.children.length)errs.push("children "+s.children.length+" != birth logs "+births);
    for(const y in s.reloc)if(s.reloc[y]>1)errs.push("relocations in "+y+": "+s.reloc[y]);
    let lastAge=-1;for(const l of s.log){if(l.age<lastAge){errs.push("log age not monotonic at "+l.age);break}lastAge=l.age}
    for(const c of s.companions){const st=sim.companionStatus(c,s.age);if(s.age<c.deathAge&&st.indexOf("死去")>=0)errs.push("companion future death leaked")}
    if(s.invest<0)errs.push("negative invest");
    s.choiceLog.forEach(c=>seenEvents.add(c.ev));
    if(errs.length){fails++;if(fails<=8)lines.push("FAIL life "+i+" (era "+era+"): "+errs.join("; "))}
  }
  lines.push("lives failed: "+fails+"/200, avg death age: "+(deathSum/200).toFixed(1));
  lines.push("distinct decision events exercised: "+seenEvents.size+"/"+EVENTS.length);
  if(fails>0)pass=false;
  lines.push("== per-era mean death age (300 lives/era) ==");
  const LE_T={1920:43,1940:50,1955:66,1990:79,2026:84,2050:88};
  for(const e of ERAS){
    let sum=0;const n=300;
    for(let i=0;i<n;i++){const sm=runHeadless("era-"+e.id+"-"+i,{era:e.id,mode:"digest"});sum+=sm.s.deathAge}
    const mean=sum/n;
    lines.push("era "+e.id+": mean death age "+mean.toFixed(1)+" (target "+LE_T[e.id]+" ±4)");
    if(Math.abs(mean-LE_T[e.id])>4){pass=false;lines.push("FAIL era mean "+e.id+": "+mean.toFixed(1)+" vs target "+LE_T[e.id])}
  }
  lines.push("== data checks ==");
  const ps=PREFS.reduce((a,p)=>a+p[1],0);
  lines.push("PREFS weights total: "+ps.toFixed(2)+" (expect 100 ±0.5)");
  if(Math.abs(ps-100)>0.5){pass=false;lines.push("FAIL PREFS sum: "+ps)}
  if(PREFS.length!==47){pass=false;lines.push("FAIL PREFS count: "+PREFS.length)}
  lines.push("== determinism ==");
  const d1=runHeadless("det-seed",{era:2026,mode:"futsuu"}).summary();
  const d2=runHeadless("det-seed",{era:2026,mode:"futsuu"}).summary();
  if(JSON.stringify(d1)!==JSON.stringify(d2)){pass=false;lines.push("FAIL determinism: same seed+script gave different summaries")}
  else lines.push("determinism: OK (same seed + script -> identical summary)");
  lines.push("== sp handler coverage ==");
  const SP_HANDLED=new Set(["cap","marry","child","exam","edu","job","jobChange","move","house","promote","investStart","treat","treatSoft","recoverResult","startupResult","bubbleResult","childOutcome","ijuResult","aiResult","parentDies","loveConfess","clubResult","retire","retireLate"]);
  let spBad=0;
  for(const ev of EVENTS)for(const ch of ev.choices)if(ch.sp){const nm=ch.sp.split(":")[0];if(!SP_HANDLED.has(nm)){spBad++;lines.push("FAIL sp without handler in _special: "+ch.sp+" ("+ev.id+")")}}
  if(!spBad)lines.push("sp coverage: OK (every sp code has a _special handler)");
  lines.push("== hitoiki expiry ==");
  const hs=new Sim("hito-expiry",{era:2026,mode:"futsuu"});
  let guard2=0;
  while(guard2++<300&&!hs.s.dead&&!(hs.s.pending&&hs.s.pending.kind==="hitoiki")){
    const r=hs.advance();
    if(r==="decision"&&hs.s.pending){const ev2=EVENT_MAP[hs.s.pending.evId];hs.choose(policyIndex(hs,ev2),"")}
  }
  if(hs.s.pending&&hs.s.pending.kind==="hitoiki"){
    const hAge=hs.s.pending.hitoAge;
    hs.answerHitoiki(null,"時間切れ");
    if(hs.s.hitoAnswers[hAge]==="（答えずに進んだ）")lines.push("hitoiki expiry: OK (records 「答えずに進んだ」, no random answer)");
    else{pass=false;lines.push("FAIL hitoiki expiry label: "+hs.s.hitoAnswers[hAge])}
  }else{pass=false;lines.push("FAIL hitoiki expiry: no hitoiki pending reached")}
  lines.push(pass?"ALL TESTS PASSED":"TESTS FAILED");
  return{pass:pass,lines:lines};
}

function resumeLife(){

  const s=saved.sim;
  const ok=s&&typeof s.age==="number"&&Array.isArray(s.ledger)&&Array.isArray(s.log)&&Array.isArray(s.children)&&Array.isArray(s.companions)&&Array.isArray(s.choiceLog)&&s.stats&&typeof s.stats.he==="number"&&s.father&&s.mother&&typeof s.father==="object"&&typeof s.mother==="object";
  if(!ok){discard();return}
  if(!Array.isArray(s.queue))s.queue=[];
  if(!Array.isArray(s.scheduled))s.scheduled=[];
  if(!s.flags||typeof s.flags!=="object")s.flags={};
  if(!s.used||typeof s.used!=="object")s.used={};

const SKYBANDKEYS=[

[0.2,[[96,158,214],[126,182,226],[168,208,238],[208,232,247]]],

function skyBandsAt(p,era){
  let bands=null;

}

function jobOutfit(job,sex,hash){

  if(/医|看護/.test(job))return"#EDEAE2";
  if(/農/.test(job))return"#6B7F4E";
  if(/大工|運転|配達|技術|調理/.test(job))return"#5B6B7A";
  if(/公務|教員/.test(job))return"#333A45";

/* ---------- game loop v3: dwell by year TYPE, matching the original's measured model ----------
   Original (measured over 3 lives at 1x): quiet year ≈11.8s, milestone year ≈21.4s,
   birth year (0->1) counts as milestone. Year length does NOT depend on log text length.
   Panels pause the year clock; decision/ひと息 panel timers stay real-time. */
const MODES={
  sakutto:{scale:0.45,label:"サクッと"},
  futsuu:{scale:1.0,label:"ふつう"},
  yukkuri:{scale:1.8,label:"じっくり"},
  haishin:{scale:2.8,label:"配信・朗読"}};
const YEAR_DWELL={quiet:11800,milestone:21400};
function modeDef(){return MODES[(sim&&sim.settings.mode)]||MODES.futsuu}
function isOmakase(){return !!(META.settings.omakase&&sim&&sim.settings.mode!=="haishin")}
function dwellForYear(isMile){return (isMile?YEAR_DWELL.milestone:YEAR_DWELL.quiet)*modeDef().scale/(ui.mult||1)}

function runLoop(){scheduleYear()}
/* After a decision/ひと息 panel resolves (choice, timer expiry, skip), the year's
   clock resumes: a chained pending queued in the same year surfaces first; when the
   year's LAST pending resolves, wait the year's stashed dwell once before advancing.
   Omakase never routes here (it keeps its own brisk auto pacing). */
function afterPanelResolved(){
  if(!sim||sim.s.dead)return;
  if(sim.s.pending||(sim.s.queue&&sim.s.queue.length)){scheduleYear();return}
  if(ui.pendingCard&&!ui.skipToDec&&chapterOf(sim.s.age)!==ui.pendingCard.prevChapter){showChapterCard(sim.s,ui.pendingCard.entries,ui.pendingCard.prevChapter)}
  ui.pendingCard=null;
  const dwell=(ui.yearDwell!=null)?ui.yearDwell:dwellForYear(false);
  ui.waiting=true;
  clearTimeout(ui.timer);
  ui.dwellInfo={total:dwell,endsAt:performance.now()+dwell};
  ui.timer=setTimeout(()=>{ui.waiting=false;ui.dwellInfo=null;scheduleYear()},dwell);
}
function scheduleYear(){
  clearStage();
  if(!sim||sim.s.dead||ui.paused||!ui.started)return;
  if(sim.s.pending){showPending();return}
  ui.stageT.push(setTimeout(()=>{if(!sim||ui.paused||sim.s.dead)return;stepYear()},REDUCED?60:450));
}
function stepYear(){
  if(!sim||sim.s.dead||ui.paused)return;
  const prevChapter=chapterOf(sim.s.age),prevLogLen=sim.s.log.length,prevAge=sim.s.age;
  ui.prevStats=Object.assign({},sim.s.stats);
  sim.advance();
  const s=sim.s,newEntries=s.log.slice(prevLogLen);
  ui.freshFrom=prevLogLen;
  if(s.age!==prevAge)sceneFx.seasonIdx++;sceneFx.walkStart=performance.now();
  const joined=newEntries.map(e=>e.txt).join("");
  const now=performance.now();
  if(/病|入院|がん|不調|倒れる/.test(joined))sceneFx.gloomUntil=now+9000;
  if(newEntries.some(e=>e.kind==="major"||e.kind==="birth")&&/合格|昇進|結婚|生まれる|優勝|成功|当選/.test(joined))spawnConfetti();
  renderLog();renderSide();renderFocus();
  const who=$("#whoName");if(who)who.innerHTML=esc(s.surname)+' '+esc(s.given)+'（'+s.age+'歳・'+s.year+'年）'+(s.generation>1?' <span class="small">家系 第'+s.generation+'代</span>':"");
  showDeltas(s.lastDeltas||{});
  saveGame();
  if(s.dead){ui.timer=setTimeout(fadeToEnding,800);return}
  /* Dwell is decided by year TYPE before any panel opens, and stashed in ui.yearDwell:
     panels pause the year clock, and afterPanelResolved() spends this dwell once the
     year's last pending resolves. A queue-promotion step (age unchanged) keeps the stash.
     Birth year (0->1, age becomes 1) is milestone class, as on the original. */
  const isMile=newEntries.some(e=>e.kind==="major"||e.kind==="birth")||chapterOf(s.age)!==prevChapter||s.age===1||!!s.pending;
  if(s.age!==prevAge){
    if(isOmakase())ui.yearDwell=1500/(ui.mult||1);
    else{ui.yearDwell=dwellForYear(isMile);if(isMile&&sim.settings.mode==="haishin")ui.yearDwell+=3000}
  }
  if(s.pending){if(isMile)ui.pendingCard={entries:newEntries,prevChapter:prevChapter};ui.skipToDec=false;showPending();return}
  ui.pendingCard=null;
  if(isMile&&!ui.skipToDec)showChapterCard(s,newEntries,prevChapter);
  const dwell=ui.skipToDec?1000:(ui.yearDwell!=null?ui.yearDwell:dwellForYear(isMile));
  ui.waiting=true;
  ui.dwellInfo={total:dwell,endsAt:performance.now()+dwell};
  ui.timer=setTimeout(()=>{ui.waiting=false;ui.dwellInfo=null;scheduleYear()},dwell);
}

function evaluateBadges(){
if(sim._badgesDone)return[];
sim._badgesDone=true;
const s=sim.s;
if(!META.prefs.includes(s.birthPref))META.prefs.push(s.birthPref);
if(!META.eras.includes(s.era))META.eras.push(s.era);
META.eraRuns[s.era]=(META.eraRuns[s.era]||0)+1;
META.eraMarks=META.eraMarks||{};META.prefCounts=META.prefCounts||{};META.totals=META.totals||{lives:0,ageSum:0,maxAge:0,minAge:999};
sim._prefNew=!(META.prefCounts[s.birthPref]>0);
META.prefCounts[s.birthPref]=(META.prefCounts[s.birthPref]||0)+1;
{const t=META.totals;t.lives++;t.ageSum+=s.deathAge;if(s.deathAge>t.maxAge)t.maxAge=s.deathAge;if(s.deathAge<t.minAge)t.minAge=s.deathAge;}
{const have=new Set(META.eraMarks[s.era]||[]);const newM=[];
for(const mk of (ERA_MARKS[s.era]||[])){let ok=false;try{ok=!!mk[2](s)}catch(e){}if(ok&&!have.has(mk[0])){have.add(mk[0]);newM.push(mk)}}
META.eraMarks[s.era]=Array.from(have);sim._eraMarksNew=newM;}
const view=Object.assign({},s,{savings:()=>savingsOf(s)});
const m={lives:META.lives,prefs:META.prefs,eras:META.eras,eraRuns:META.eraRuns,shared:META.shared};
const earned=[];
for(const b of BADGES){let ok=false;try{ok=!!b[3](view,m)}catch(e){}if(ok&&!META.badges[b[0]]){META.badges[b[0]]=true;earned.push(b)}}
META.lives++;

META.past.unshift({name:sum.name,pref:s.birthPref,deathAge:sum.deathAge,cause:sum.cause,title:sum.title});
META.past=META.past.slice(0,10);
saveMeta();
return earned;
}

     previous handler called syncControlBar()/kickTimer(), which never
     existed, so the feature was silently dead behind its try/catch. */
  if(typeof sim==="undefined"||!sim||sim.s.dead||!ui.started)return;
  if(document.hidden){
    if(ui.paused||ui.autoPaused||!$("#sceneWrap"))return;
    ui.autoPaused=true;
    clearTimeout(ui.timer);
    (ui.stageT||[]).forEach(clearTimeout);ui.stageT=[];
    clearInterval(ui.modalTimer);
  }else if(ui.autoPaused){
    ui.autoPaused=false;
    if(sim.s.pending){if($("#modalOv"))runModalCountdown()}
    else if(ui.dwellInfo){const rem=Math.max(0,ui.dwellInfo.endsAt-performance.now());ui.timer=setTimeout(()=>{ui.waiting=false;ui.dwellInfo=null;scheduleYear()},rem)}
    else if(ui.waiting){ui.waiting=false;scheduleYear()}
  }
});
renderLanding();
}
}
</script>
